name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 发布前门禁：真实 dsh-llm 端到端校验（llm-invariant + BlockAssembler）。
      # 尽力安装固定版本的 DSH —— registry 抖动不应让发布卡死；装到了就必须过。
      # 注意：升级下面的 DSH 版本前，先在本地跑一遍 stress-real-invariant 确认契约没变。
      - name: Install DSH for the real-invariant check (best effort)
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2

      - name: Real-invariant end-to-end check
        run: node tests/stress-real-invariant.mjs

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
