name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # 发布前门禁固定使用的 DSH 版本；升级前先在本地跑一遍：
  #   npm install --no-save --no-audit --no-fund @deepseek-ai/dsh@<版本>
  #   node tests/stress-real-invariant.mjs
  DSH_GATE_VERSION: '0.2.1-rc.1'

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 发布前门禁：真实 dsh-llm 契约校验。
      # 真实实现层按上游版本自动选择：有 dsh-llm/invariant（0.2.0 时代）就用它，
      # 否则用真实 cordis Context 的 llm/stream 瀑布（0.2.1-rc.1 起），输出统一交给真实 BlockAssembler。
      # 尽力安装固定版本的 DSH —— registry 抖动不应让发布卡死；装到了就必须过（见下一步的 DSH_GATE_REQUIRE_REAL）。
      - name: Install DSH for the real-contract check (best effort)
        id: install-dsh
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund "@deepseek-ai/dsh@${{ env.DSH_GATE_VERSION }}"

      - name: Report the DSH version used by the gate
        continue-on-error: true
        run: |
          node -e "const fs=require('fs'),path=require('path');for(const name of ['@deepseek-ai/dsh','@deepseek-ai/dsh-llm']){let file;try{file=require.resolve(name+'/package.json')}catch(_e){file=path.join('node_modules',name,'package.json')}try{console.log('gate '+name+' = '+JSON.parse(fs.readFileSync(file,'utf8')).version)}catch(_e){console.log('gate '+name+' = 未安装')}}"

      - name: Real DSH contract check
        env:
          # 安装成功 ⇒ 必须真的跑通真实实现层；安装失败 ⇒ 允许 SKIP（沿用既有 best-effort 语义）。
          DSH_GATE_REQUIRE_REAL: ${{ steps.install-dsh.outcome == 'success' && '1' || '0' }}
        run: node tests/stress-real-invariant.mjs

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
