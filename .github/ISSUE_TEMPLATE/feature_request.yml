name: 功能建议
description: 提出新功能、体验改进或配置项建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！请尽量说明「要解决什么问题」，而不只是「加一个按钮」，
        这样更容易判断是否适合放进插件主路径。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，确认不是重复建议
          required: true
        - label: 这个建议与「重复输出守卫」的核心目标相关
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / 使用场景
      description: 当前哪里不方便？在什么模型、什么输出形态下最明显？
      placeholder: "例如：我希望把常误报的整段短语一键加入忽略列表，现在要手动复制两次。"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望插件怎么表现？最好描述结果而不是实现细节
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 当前设置、白名单或其它工具能否绕过？为什么不满意？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及区域
      options:
        - 重复检测 / 阈值
        - 决策卡片 / 截停
        - 设置页 / 配置项
        - 截停通知 / 继续指令
        - 持久化日志 / 最近记录
        - 文档
        - 其它
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 当前插件版本
      placeholder: "1.14.0"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 草图、示例输出、相关 Issue 链接等
    validations:
      required: false
